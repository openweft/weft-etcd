name: Build

# Pull-request check: build the image for every release platform without
# pushing, so a Dockerfile or upstream-version bump is exercised before it
# is merged and tagged. The release workflow only runs on tags.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,riscv64,loong64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/riscv64,linux/loong64
          push: false
          provenance: false
          sbom: false
